name: T&P Tests

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tnp-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run lint
        continue-on-error: true
        run: |
          if bun -e "process.exit(
            Object.hasOwn(require('./package.json').scripts ?? {}, 'lint')
              ? 0 : 1
          )"; then
            bun run lint
          else
            echo "No lint script configured; skipping."
          fi

      - name: Run tests
        run: |
          if bun -e "process.exit(
            Object.hasOwn(require('./package.json').scripts ?? {}, 'test')
              ? 0 : 1
          )"; then
            bun run test
          else
            echo "No test script configured; skipping."
          fi

      - name: Verify production build
        run: bun run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: |
          if bun -e "process.exit(
            Object.hasOwn(require('./package.json').scripts ?? {}, 'test')
              ? 0 : 1
          )"; then
            bun run test
          else
            echo "No test script configured; skipping."
          fi
